name: Author profile browser checks
on:
  pull_request:
    paths: ['profile.html', 'about.html', 'index.html', 'style.css', 'script.js', 'tests/profile-browser.cjs', '.github/workflows/profile-checks.yml']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/profile-http.log 2>&1 &
          node tests/profile-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: author-profile-screenshots
          path: test-artifacts/profile/
          if-no-files-found: warn
          retention-days: 7
